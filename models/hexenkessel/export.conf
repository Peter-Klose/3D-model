# Export recipe, read by scripts/export_all.sh
#   part <name> <scad file in src/> [openscad args]  -> stl/<name>.stl + preview/<name>.png
#   shade <name> <part> X0 X1 Z0 Z1                  -> preview/<name>.png, shaded front view of stl/<part>.stl
#   view <name> <scad file in src/> [openscad args]  -> preview/<name>.png only (give a --camera)
part kessel_mit_henkel  hexenkessel.scad -D 'part="kessel_mit_henkel"'
part kessel_ohne_henkel hexenkessel.scad -D 'part="kessel_ohne_henkel"'
part deckel             hexenkessel.scad -D 'part="deckel"'
part henkel             hexenkessel.scad -D 'part="henkel"'
view assembly           hexenkessel.scad -D 'part="assembly_stl"' --camera=0,0,0,66,0,22,0 --viewall --autocenter
view front              hexenkessel.scad -D 'part="assembly_stl"' --camera=0,0,0,84,0,0,0 --viewall --autocenter --projection=ortho
shade emblem_relief     kessel_mit_henkel -42 42 30 106
view emblem             emblem.scad --camera=0,0,0,0,0,0,190 --projection=ortho
